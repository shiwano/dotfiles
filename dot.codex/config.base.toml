approval_policy = 'on-request'
commit_attribution = ''
model = 'gpt-6-astra'
model_reasoning_effort = 'medium'
project_doc_fallback_filenames = ['CLAUDE.md']
sandbox_mode = 'danger-full-access'

[analytics]
enabled = false

[feedback]
enabled = false

[hooks]
[[hooks.PermissionRequest]]
[[hooks.PermissionRequest.hooks]]
command = 'codex-hook'
timeout = 10
type = 'command'

[[hooks.PostToolUse]]
matcher = '^apply_patch$'

[[hooks.PostToolUse.hooks]]
command = 'codex-hook'
timeout = 30
type = 'command'

[[hooks.Stop]]
[[hooks.Stop.hooks]]
command = 'codex-hook'
timeout = 180
type = 'command'

[mcp_servers]
[mcp_servers.figma]
url = 'https://mcp.figma.com/mcp'

[sandbox_workspace_write]
network_access = true
writable_roots = ['/tmp', '/run/user']

[tui]
[tui.model_availability_nux]
'gpt-5.5' = 4
'gpt-5.6-sol' = 1
gpt-6-astra = 1
